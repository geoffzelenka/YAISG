name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_SHA: ${{ github.sha }}

jobs:
  python:
    name: ${{ matrix.service }} (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            database: sqlite
          - service: game
            database: sqlite
          - service: auth
            database: postgres
          - service: game
            database: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yaisg
          POSTGRES_PASSWORD: yaisg
          POSTGRES_DB: yaisg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaisg -d yaisg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: Install service
        run: python -m pip install -e "services/${{ matrix.service }}[dev]"
      - name: Verify PostgreSQL migrations
        if: matrix.database == 'postgres'
        working-directory: services/${{ matrix.service }}
        run: alembic upgrade head && alembic current && alembic check
        env:
          AUTH_DATABASE_URL: postgresql+psycopg://yaisg:yaisg@localhost:5432/yaisg_test
          GAME_DATABASE_URL: postgresql+psycopg://yaisg:yaisg@localhost:5432/yaisg_test
      - name: Check service
        run: make ${{ matrix.service }}-ci
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://yaisg:yaisg@localhost:5432/yaisg_test' || '' }}
      - name: Script checks and thirty-day seed check
        if: matrix.service == 'game'
        run: make scripts-ci seed-check
      - name: XP-rate content report (warning only)
        if: always() && matrix.service == 'game'
        continue-on-error: true
        run: make content-lint

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: make client-ci
